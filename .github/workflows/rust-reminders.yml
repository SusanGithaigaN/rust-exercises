name: Rust practice email reminders

on:
  # schedule:
  #   # EAT is UTC+3: 08:00 EAT = 05:00 UTC.
  #   - cron: '0 5 * * *'
  #   # 20:30 EAT = 17:30 UTC.
  #   - cron: '30 17 * * *'
  workflow_dispatch:
    inputs:
      kind:
        description: Reminder to send
        required: true
        type: choice
        options:
          - morning
          - evening

permissions:
  contents: write

# Share this group with the progress-recording workflow to prevent lost updates.
concurrency:
  group: rust-progress-${{ github.ref }}
  cancel-in-progress: false

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Save today's plan
        run: |
          set -euo pipefail
          python scripts/progress.py plan > /dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add learning/progress.json
          if ! git diff --cached --quiet; then
            git commit -m 'Save daily Rust practice plan'
            git push
          fi
      - name: Send email
        env:
          HOSTINGER_EMAIL: ${{ secrets.HOSTINGER_EMAIL }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_KIND: ${{ inputs.kind }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            reminder_kind="$MANUAL_KIND"
          elif [[ "$SCHEDULE" == '0 5 * * *' ]]; then
            reminder_kind=morning
          elif [[ "$SCHEDULE" == '30 17 * * *' ]]; then
            reminder_kind=evening
          else
            echo 'Unknown reminder schedule.' >&2
            exit 1
          fi
          python scripts/send_reminder.py "$reminder_kind"
